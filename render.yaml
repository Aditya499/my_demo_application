services:
  - type: web
    name: medconnect-healthcare
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: USE_SQLITE
        value: "true"
      - key: PORT
        value: "8080"
